<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול גלריה - דף מנהל</title>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>

    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .admin-header {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .admin-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .admin-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .admin-content {
            padding: 40px;
        }

        .config-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 5px solid #4ecdc4;
        }

        .config-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }

        .form-group input, .form-group select {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.1);
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
        }

        .btn-success {
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .upload-section {
            text-align: center;
            padding: 40px;
            border: 3px dashed #4ecdc4;
            border-radius: 15px;
            margin: 30px 0;
            background: linear-gradient(45deg, rgba(78, 205, 196, 0.1), rgba(255, 107, 107, 0.1));
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .gallery-preview {
            margin-top: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .gallery-item-info {
            padding: 10px;
            background: white;
        }

        .gallery-item-info h4 {
            margin-bottom: 5px;
            color: #333;
        }

        .gallery-item-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .image-number {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            z-index: 10;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 107, 107, 0.9);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .delete-btn {
            opacity: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            opacity: 0.9;
        }

        .success-message, .error-message {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4ecdc4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
            font-size: 1rem;
        }

        .tab.active {
            background: #4ecdc4;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .admin-content {
                padding: 20px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🎈 ניהול גלריה מתקדם</h1>
            <p>העלה, נהל ואגן את התמונות שלך בקלות</p>
        </div>

        <div class="admin-content">
            <!-- הודעות -->
            <div id="successMessage" class="success-message"></div>
            <div id="errorMessage" class="error-message"></div>
            
            <!-- Loading -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>מעלה תמונות...</p>
            </div>

            <!-- כרטיסיות -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('config')">⚙️ הגדרות</button>
                <button class="tab" onclick="switchTab('upload')">📤 העלאה</button>
                <button class="tab" onclick="switchTab('gallery')">🖼️ גלריה</button>
                <button class="tab" onclick="switchTab('stats')">📊 סטטיסטיקות</button>
            </div>

            <!-- תוכן כרטיסיות -->
            
            <!-- הגדרות -->
            <div id="configTab" class="tab-content active">
                <div class="config-section">
                    <h2>🔧 הגדרות Cloudinary</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cloudName">Cloud Name</label>
                            <input type="text" id="cloudName" placeholder="your-cloud-name">
                        </div>
                        <div class="form-group">
                            <label for="uploadPreset">Upload Preset</label>
                            <input type="text" id="uploadPreset" placeholder="your-upload-preset">
                        </div>
                        <div class="form-group">
                            <label for="apiKey">API Key (אופציונלי)</label>
                            <input type="text" id="apiKey" placeholder="your-api-key">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="saveConfig()">💾 שמור הגדרות</button>
                </div>

                <div class="config-section">
                    <h2>🏷️ ניהול קטגוריות</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="newCategoryKey">מפתח קטגוריה (באנגלית)</label>
                            <input type="text" id="newCategoryKey" placeholder="balloon-flowers">
                        </div>
                        <div class="form-group">
                            <label for="newCategoryName">שם קטגוריה (בעברית)</label>
                            <input type="text" id="newCategoryName" placeholder="פרחים מבלונים">
                        </div>
                    </div>
                    <button class="btn btn-success" onclick="addCategory()">➕ הוסף קטגוריה</button>
                    
                    <div id="categoriesList" style="margin-top: 20px;"></div>
                </div>
            </div>

            <!-- העלאה -->
            <div id="uploadTab" class="tab-content">
                <div class="upload-section">
                    <div class="upload-icon">📸</div>
                    <h2>העלה תמונות חדשות</h2>
                    <p>בחר קטגוריה והעלה מספר תמונות בבת אחת</p>
                    
                    <div class="form-group" style="margin: 20px auto; max-width: 300px;">
                        <label for="uploadCategory">בחר קטגוריה:</label>
                        <select id="uploadCategory">
                            <option value="">-- בחר קטגוריה --</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-primary btn-large" onclick="openUploadWidget()">
                        📤 פתח חלון העלאה
                    </button>
                </div>
            </div>

            <!-- גלריה -->
            <div id="galleryTab" class="tab-content">
                <div class="config-section">
                    <h2>🖼️ גלריה נוכחית</h2>
                    <div style="margin-bottom: 20px;">
                        <select id="filterCategory" onchange="filterGallery()">
                            <option value="all">הכל</option>
                        </select>
                        <button class="btn btn-secondary" onclick="refreshGallery()">🔄 רענן</button>
                        <button class="btn btn-primary" onclick="generateGalleryCode()">💻 צור קוד לאתר</button>
                    </div>
                    <div id="galleryGrid" class="gallery-grid"></div>
                </div>
            </div>

            <!-- סטטיסטיקות -->
            <div id="statsTab" class="tab-content">
                <div class="stats-grid" id="statsGrid"></div>
                
                <div class="config-section">
                    <h2>📈 פעולות מתקדמות</h2>
                    <button class="btn btn-primary" onclick="exportGalleryData()">💾 ייצא נתוני גלריה</button>
                    <button class="btn btn-secondary" onclick="importGalleryData()">📥 ייבא נתוני גלריה</button>
                    <button class="btn btn-success" onclick="generateBackup()">🔒 צור גיבוי</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // נתונים גלובליים
        let galleryData = [];
        let categories = {
            '': 'בחר קטגוריה',
            'room-arrangements': 'סידורי חדרים',
            'balloon-numbers': 'מספרים מבלונים',
            'arches': 'קשתות',
            'photo-reviews': 'קירות צילום',
            'flowers-balloons': 'פרחים מבלונים',
            'kids-balloons': 'בלונים לילדים',
            'gender-reveal': 'גילוי מין',
            'balloon-bouquet': 'זר בלונים',
            'centerpiece': 'שולחן מרכזי',
            'birth-celebration': 'הולדת בן / בת'
        };
        
        let cloudinaryConfig = {
            cloudName: 'dbbivwbbt',
            apiKey: '549784497364423',
            uploadPreset: 'balloon_gallery',
            folder: 'balloon-gallery'
        };

        
        // פונקציה מתוקנת לטעינת הגלריה מה-API שלך
        async function loadGalleryFromServer() {
            try {
                const response = await fetch('http://localhost:3001/api/balloon-gallery');
                if (response.ok) {
                    const data = await response.json();
                    galleryData = data.map((img, index) => ({
                        id: img.public_id || Date.now() + Math.random(),
                        publicId: img.public_id,
                        url: img.url || img.secure_url,
                        thumbnail: img.optimizedUrls?.thumbnail || img.url || img.secure_url,
                        fullsize: img.optimizedUrls?.fullsize || img.url || img.secure_url,
                        title: img.public_id || `תמונה מספר ${index + 1}`,
                        category: img.category || '',
                        uploadDate: img.created_at || new Date().toISOString(),
                        imageNumber: index + 1
                    }));
                    refreshGallery();
                    updateStats && updateStats();
                } else {
                    galleryData = [];
                    refreshGallery();
                }
            } catch (error) {
                console.warn('⚠️ Failed to load from server:', error);
                galleryData = [];
                refreshGallery();
            }
        }

        // טעינה ישירה מ-Cloudinary
        async function loadFromCloudinaryDirect() {
            if (!cloudinaryConfig.cloudName || cloudinaryConfig.cloudName === 'your-cloud-name') {
                throw new Error('Cloudinary not configured');
            }

            // נשתמש ב-API הציבורי של Cloudinary
            const searchUrl = `https://res.cloudinary.com/${cloudinaryConfig.cloudName}/image/list/${cloudinaryConfig.folder}.json`;
            
            try {
                const response = await fetch(searchUrl);
                if (response.ok) {
                    const data = await response.json();
                    if (data.resources && data.resources.length > 0) {
                        galleryData = data.resources.map((resource, index) => ({
                            id: resource.public_id || `image_${index}_${Date.now()}`,
                            publicId: resource.public_id,
                            url: resource.secure_url || resource.url,
                            thumbnail: generateOptimizedUrl(resource.secure_url || resource.url, 'thumbnail'),
                            fullsize: generateOptimizedUrl(resource.secure_url || resource.url, 'fullsize'),
                            title: `תמונה מספר ${index + 1}`,
                            category: extractCategoryFromPath(resource.public_id),
                            uploadDate: resource.created_at || new Date().toISOString(),
                            imageNumber: index + 1
                        }));
                        return;
                    }
                }
            } catch (error) {
                console.error('Error loading from Cloudinary:', error);
            }
            
            throw new Error('Could not load from Cloudinary');
        }

        // רענון נתונים ברקע
        async function refreshDataInBackground() {
            try {
                console.log('🔄 Refreshing data in background...');
                const oldCount = galleryData.length;
                
                await loadFromCloudinaryDirect();
                
                if (galleryData.length > 0) {
                    localStorage.setItem('galleryData', JSON.stringify(galleryData));
                    localStorage.setItem('galleryDataTimestamp', Date.now().toString());
                    refreshGallery();
                    updateStats();
                    
                    if (galleryData.length !== oldCount) {
                        showMessage(`הנתונים עודכנו ברקע! נמצאו ${galleryData.length} תמונות`, 'success');
                    }
                }
            } catch (error) {
                console.warn('Background refresh failed:', error);
            }
        }

        // נתוני דמו לאדמין
        function loadDemoDataForAdmin() {
            galleryData = [];
            
            console.log('📝 Demo data loaded for admin');
        }

        // עדכון מצב החיבור
        function updateConnectionStatus(status) {
            // זה יעבוד רק אם יש לנו את האינדיקטור
            const statusElement = document.getElementById('connectionStatus');
            const indicatorElement = document.getElementById('connectionIndicator');
            
            if (statusElement && indicatorElement) {
                switch(status) {
                    case 'connected':
                        statusElement.textContent = 'מחובר לשרת ✓';
                        indicatorElement.className = 'status-indicator connected';
                        break;
                    case 'cloudinary':
                        statusElement.textContent = 'מחובר ל-Cloudinary ✓';
                        indicatorElement.className = 'status-indicator connected';
                        break;
                    case 'offline':
                        statusElement.textContent = 'לא מקוון (נתונים שמורים)';
                        indicatorElement.className = 'status-indicator disconnected';
                        break;
                    case 'demo':
                        statusElement.textContent = 'מצב דמו';
                        indicatorElement.className = 'status-indicator checking';
                        break;
                }
            }
        }

        // יצירת URLs מאופטמים
        function generateOptimizedUrl(originalUrl, size) {
            if (!originalUrl) return '';
            
            const transformations = {
                thumbnail: 'w_300,h_200,c_fill,q_auto,f_auto',
                medium: 'w_800,h_600,c_limit,q_auto,f_auto',
                fullsize: 'w_1200,h_900,c_limit,q_auto,f_auto'
            };
            
            if (originalUrl.includes('cloudinary.com')) {
                return originalUrl.replace('/upload/', `/upload/${transformations[size]}/`);
            }
            
            return originalUrl;
        }

        // פונקציה לחילוץ קטגוריה מהנתיב
        function extractCategoryFromPath(path) {
            if (!path) return 'balloon-bouquet';
            
            if (path.includes('balloon-gallery/')) {
                const parts = path.split('balloon-gallery/')[1].split('/');
                return parts[0] || 'balloon-bouquet';
            }
            
            const knownCategories = Object.keys(categories);
            const foundCategory = knownCategories.find(cat => path.includes(cat));
            
            return foundCategory || 'balloon-bouquet';
        }

        // אתחול העמוד - מתוקן
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🎈 Admin Panel Loading...');
            
            // טעינת הגדרות
            loadConfig();
            updateCategoriesList();
            updateCategorySelects();
            
            // טעינת נתוני הגלריה
            await loadGalleryFromServer();
            
            // עדכון התצוגה
            refreshGallery();
            updateStats();
            
            console.log('✅ Admin Panel Ready with', galleryData.length, 'images');
            showMessage(`טעינה הושלמה - ${galleryData.length} תמונות`, 'success');
        });

        // רענון הגלריה - מתוקן עם בדיקות
        function refreshGallery() {
            console.log('🔄 Refreshing gallery display...');
            
            const container = document.getElementById('galleryGrid');
            if (!container) {
                console.error('Gallery container not found');
                return;
            }

            const filter = document.getElementById('filterCategory')?.value || 'all';
            
            let filteredData = galleryData;
            if (filter && filter !== 'all') {
                filteredData = galleryData.filter(img => img.category === filter);
            }
            
            // מיון לפי מספר תמונה
            filteredData.sort((a, b) => (a.imageNumber || 0) - (b.imageNumber || 0));
            
            container.innerHTML = '';
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                        <h3>אין תמונות להצגה</h3>
                        <p>בחר קטגוריה אחרת או העלה תמונות חדשות</p>
                        <button class="btn btn-primary" onclick="manualRefresh()" style="margin-top: 15px;">
                            🔄 נסה לטעון שוב
                        </button>
                    </div>
                `;
                return;
            }
            
            filteredData.forEach((image, index) => {
                const imageDiv = document.createElement('div');
                imageDiv.className = 'gallery-item';
                imageDiv.innerHTML = `
                    <div class="image-number">${image.imageNumber || index + 1}</div>
                    <img src="${image.thumbnail}" alt="${image.title}" loading="lazy" 
                         onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjBmMGYwIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPtGQ15XXkdGO16DXlDwvdGV4dD48L3N2Zz4K';">
                    <button class="delete-btn" onclick="deleteImage('${image.id}')">&times;</button>
                    <div class="gallery-item-info">
                        <h4>${image.title}</h4>
                        <p>${categories[image.category] || image.category}</p>
                    </div>
                `;
                container.appendChild(imageDiv);
            });
            
            console.log('✅ Gallery refreshed with', filteredData.length, 'images');
        }

        // הוספת תמונה לגלריה - רענון מהשרת
        async function addImageToGallery(imageInfo, category) {
            await loadGalleryFromServer();
            refreshGallery();
            updateStats();
            showMessage('התמונה נוספה בהצלחה!', 'success');
        }

        // פונקציה לרענון ידני של הנתונים
        async function manualRefresh() {
            showMessage('מרענן נתונים...', 'success');
            
            try {
                await loadGalleryFromServer();
                refreshGallery();
                updateStats();
                showMessage(`רענון הושלם - ${galleryData.length} תמונות`, 'success');
            } catch (error) {
                showMessage('שגיאה ברענון הנתונים', 'error');
                console.error('Manual refresh error:', error);
            }
        }

        function addCategory() {
            const key = document.getElementById('newCategoryKey').value.trim();
            const name = document.getElementById('newCategoryName').value.trim();
            
            if (!key || !name) {
                showMessage('יש למלא את כל השדות', 'error');
                return;
            }
            
            categories[key] = name;
            localStorage.setItem('categories', JSON.stringify(categories));
            
            updateCategoriesList();
            updateCategorySelects();

        function updateCategoriesList() {
            const container = document.getElementById('categoriesList');
            container.innerHTML = '';
            
            Object.entries(categories).forEach(([key, name]) => {
                const categoryDiv = document.createElement('div');
                categoryDiv.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 10px; background: white; margin: 5px 0; border-radius: 5px;';
                categoryDiv.innerHTML = `

                container.appendChild(categoryDiv);
            });
        }

        function deleteCategory(key) {
            if (confirm('אתה בטוח שברצונך למחוק את הקטגוריה הזו?')) {
                delete categories[key];
                localStorage.setItem('categories', JSON.stringify(categories));
                updateCategoriesList();
                updateCategorySelects();
                showMessage('הקטגוריה נמחקה בהצלחה!', 'success');
            }
        }

        function updateCategorySelects() {
            const selects = ['uploadCategory', 'filterCategory'];
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                if (!select) return;
                
                const currentValue = select.value;
                select.innerHTML = '';
                
                if (selectId === 'filterCategory') {
                    const allOption = document.createElement('option');
                    allOption.value = 'all';
                    allOption.textContent = 'הכל';
                    select.appendChild(allOption);
                }
                
                if (selectId === 'uploadCategory') {
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = '-- בחר קטגוריה --';
                    select.appendChild(defaultOption);
                }
                
                Object.entries(categories).forEach(([key, name]) => {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = name;
                    select.appendChild(option);
                });
                
                select.value = currentValue;
            });
        }

        function openUploadWidget() {
            const category = document.getElementById('uploadCategory').value;
            
            if (!category) {
                showMessage('יש לבחור קטגוריה קודם', 'error');
                return;
            }
            
            if (!cloudinaryConfig.cloudName || !cloudinaryConfig.uploadPreset) {
                showMessage('יש להגדיר קודם את פרטי Cloudinary', 'error');
                return;
            }
            
            console.log('📤 Opening upload widget for category:', category);
            
            const widget = cloudinary.createUploadWidget({
                cloudName: cloudinaryConfig.cloudName,
                uploadPreset: cloudinaryConfig.uploadPreset,
                sources: ['local', 'url', 'camera'],
                multiple: true,
                maxFiles: 20,
                folder: `${cloudinaryConfig.folder}/${category}`,
                tags: [category, 'gallery', 'balloon-gallery'],
                transformation: [
                    {width: 1200, height: 800, crop: 'limit', quality: 'auto', fetch_format: 'auto'}
                ],
                context: {
                    custom: {
                        category: category,
                        gallery: 'balloon-gallery'
                    }
                }
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    console.log('✅ Upload successful:', result.info.public_id);
                    addImageToGallery(result.info, category);
                }
                
                if (result && result.event === "close") {
                    console.log('📤 Upload widget closed');
                    setTimeout(() => {
                        refreshGallery();
                    }, 1000);
                }
                
                if (error) {
                    console.error('❌ Upload error:', error);
                    showMessage('שגיאה בהעלאת התמונה', 'error');
                }
            });
            
            widget.open();
        }

        function importGalleryData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        
                        if (data.galleryData) {
                            galleryData = data.galleryData.map((img, index) => ({
                                ...img,
                                imageNumber: img.imageNumber || index + 1
                            }));
                        }
                        if (data.categories) categories = data.categories;
                        if (data.cloudinaryConfig) cloudinaryConfig = data.cloudinaryConfig;
                        
                        localStorage.setItem('galleryData', JSON.stringify(galleryData));
                        localStorage.setItem('categories', JSON.stringify(categories));
                        localStorage.setItem('cloudinaryConfig', JSON.stringify(cloudinaryConfig));
                        localStorage.setItem('galleryDataTimestamp', Date.now().toString());
                        
                        loadConfig();
                        updateCategoriesList();
                        updateCategorySelects();
                        refreshGallery();
                        updateStats();
                        
                        showMessage('הנתונים יובאו בהצלחה עם מספור!', 'success');
                    } catch (error) {
                        showMessage('שגיאה בקריאת הקובץ', 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function showMessage(message, type) {
            const successEl = document.getElementById('successMessage');
            const errorEl = document.getElementById('errorMessage');
            
            if (!successEl || !errorEl) return;
            
            successEl.style.display = 'none';
            errorEl.style.display = 'none';
            
            if (type === 'success') {
                successEl.textContent = message;
                successEl.style.display = 'block';
                setTimeout(() => successEl.style.display = 'none', 5000);
            } else {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
                setTimeout(() => errorEl.style.display = 'none', 5000);

            const searchTerm = prompt('הקלד מילת חיפוש:');
            if (!searchTerm) return;
            
            const results = galleryData.filter(img => 
                img.title.includes(searchTerm) || 
                img.description.includes(searchTerm) ||
                categories[img.category].includes(searchTerm) ||
                img.imageNumber.toString().includes(searchTerm)
            );
            
            if (results.length === 0) {
                showMessage('לא נמצאו תוצאות', 'error');
                return;
            }
            
            const container = document.getElementById('galleryGrid');
            if (!container) return;
            
            container.innerHTML = '';
            
            results.forEach((image, index) => {
                const imageDiv = document.createElement('div');
                imageDiv.className = 'gallery-item';
                imageDiv.innerHTML = `
                    <div class="image-number">${image.imageNumber}</div>
                    <img src="${image.thumbnail}" alt="${image.title}" loading="lazy">
                    <button class="delete-btn" onclick="deleteImage('${image.id}')">&times;</button>
                    <div class="gallery-item-info">
                        <h4>${image.title}</h4>
                        <p>${categories[image.category] || image.category}</p>
                    </div>
                `;
                container.appendChild(imageDiv);
            });
            
            showMessage(`נמצאו ${results.length} תוצאות`, 'success');
        }

        function editImage(imageId) {
            const image = galleryData.find(img => img.id === imageId);
            if (!image) return;
            
            const newTitle = prompt('כותרת חדשה:', image.title);
            const newDescription = prompt('תיאור חדש:', image.description);
            const newNumber = prompt('מספר תמונה חדש:', image.imageNumber);
            
            if (newTitle !== null) image.title = newTitle;
            if (newDescription !== null) image.description = newDescription;
            if (newNumber !== null && !isNaN(newNumber)) {
                image.imageNumber = parseInt(newNumber);
                galleryData.sort((a, b) => (a.imageNumber || 0) - (b.imageNumber || 0));
            }
            
            localStorage.setItem('galleryData', JSON.stringify(galleryData));
            localStorage.setItem('galleryDataTimestamp', Date.now().toString());
            refreshGallery();
            showMessage('פרטי התמונה עודכנו!', 'success');
        }

                return;

            try {

                updateConnectionStatus('offline');

            }
        }, 30000);

        // התראה לפני יציאה מהעמוד
        window.addEventListener('beforeunload', function(e) {
            if (galleryData.length > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // פונקציה לסנכרון עם השרת
        async function syncWithServer() {
            try {
                await loadGalleryFromCloudinary();
                refreshGallery();
                updateStats();
                showMessage('סנכרון עם השרת הושלם!', 'success');
            } catch (error) {
                showMessage('שגיאה בסנכרון עם השרת', 'error');
            }
        }

        console.log('🎈 Advanced Gallery Admin v2.1 with Persistent Data loaded!');
    </script>
</body>
</html>
